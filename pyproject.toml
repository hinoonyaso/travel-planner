[project]
name = "travel-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sunub", email = "bsc5672@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.2",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]
# datas/ 수집·가공 도구용. 가벼워서 기본으로 함께 설치한다.
data = [
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[tool.uv]
# backend 는 루트 기준 import(backend.*) 라서 패키지로 빌드하지 않는다.
package = false
default-groups = ["dev", "data"]

# 모델 학습·추론 의존성(torch 등)은 model/ 에 분리한다.
# 필요할 때만: uv sync --package tripfit-model --inexact
[tool.uv.workspace]
members = ["model"]
